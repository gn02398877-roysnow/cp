name: CPBL Auto Scraper

on:
  schedule:
    # 每天台灣時間中午 12:30 自動執行
    - cron: '30 4 * * *'
  workflow_dispatch: # 讓你可以手動按按鈕測試

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install axios firebase-admin

      - name: Run Scraper
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e "
          const axios = require('axios');
          const admin = require('firebase-admin');

          const serviceAccount = JSON.parse(process.env.FIREBASE_KEY);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });
          const db = admin.firestore();

          async function scrape() {
            try {
              // 1. 算好正確的台灣時間與日期格式
              const now = new Date();
              const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
              const twTime = new Date(utc + (3600000 * 8));
              const year = twTime.getFullYear();
              const month = String(twTime.getMonth() + 1).padStart(2, '0');
              const day = String(twTime.getDate()).padStart(2, '0');
              
              const todayStr = \`\${year}-\${month}-\${day}\`; // 網頁跟資料庫用的：2026-07-29
              const apiDateStr = \`\${year}/\${month}/\${day}\`; // 中職 API 用的：2026/07/29

              console.log('正在從中職後台撈取此日期的賽事：', apiDateStr);

              // 🎯 直接轟擊中職官方的賽程 API 節點 (KindCode=A 代表一軍賽事)
              const res = await axios.get(\`https://www.cpbl.com.tw/schedule/GetScheduleList?Year=\${year}&Month=\${month}&KindCode=A\`, {
                headers: { 'User-Agent': 'Mozilla/5.0' }
              });

              let gamesData = [];

              // 2. 官方 API 會回傳一整個月的乾淨陣列，我們直接過濾出「今天」的比賽
              if (res.data && Array.isArray(res.data)) {
                const todaysGames = res.data.filter(g => g.GameDate && g.GameDate.includes(apiDateStr));
                
                todaysGames.forEach(g => {
                  gamesData.push({
                    awayTeam: g.AwayTeamName || '客隊',
                    awayPitcher: g.AwayPitcherName || '未定',
                    homeTeam: g.HomeTeamName || '主隊',
                    homePitcher: g.HomePitcherName || '未定',
                    venue: g.PlaceName || '未定球場'
                  });
                });
              }

              // 3. 塞進 Firebase
              await db.collection('daily_games').doc(todayStr).set({ games: gamesData });
              console.log(\`【大成功】今天共有 \${gamesData.length} 場比賽，已完美寫入 Firebase！\`);
            } catch (err) {
              console.error('抓取失敗:', err);
              process.exit(1);
            }
          }
          scrape();
          "
