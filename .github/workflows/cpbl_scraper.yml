name: CPBL Auto Scraper

on:
  schedule:
    # 每天國際標準時間 04:30 (台灣時間中午 12:30) 自動執行
    - cron: '30 4 * * *'
  workflow_dispatch: # 讓你可以手動在 GitHub 按按鈕立刻執行測試

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install axios firebase-admin

      - name: Run Scraper
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e "
          const axios = require('axios');
          const admin = require('firebase-admin');

          const serviceAccount = JSON.parse(process.env.FIREBASE_KEY);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });
          const db = admin.firestore();

          async function scrape() {
            try {
              // 統一取得台灣日期的各種格式
              const now = new Date();
              const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
              const twTime = new Date(utc + (3600000 * 8));
              
              const year = twTime.getFullYear();
              const month = String(twTime.getMonth() + 1).padStart(2, '0');
              const day = String(twTime.getDate()).padStart(2, '0');
              
              const todayStr = \`\${year}-\${month}-\${day}\`; // 2026-07-29
              const queryDate = \`\${year}/\${month}/\${day}\`; // 2026/07/29

              console.log('正在為日期抓取官方賽程數據：', queryDate);

              // 🎯 核心：直接對接中職官方後台賽程 API (依當年度月份抓取整月數據)
              const res = await axios.get(\`https://www.cpbl.com.tw/schedule/index/\${year}/\${month}.html?KindCode=A\`, {
                headers: { 'User-Agent': 'Mozilla/5.0' }
              });

              // 由於官方回傳的是乾淨的動態賽程 JSON，我們直接過濾出「今天」的賽事
              let gamesData = [];
              
              if (res.data && res.data.data) {
                // 過濾今天有進行的比賽
                const todaysGamesRaw = res.data.data.filter(g => g.GameDate && g.GameDate.includes(queryDate));
                
                todaysGamesRaw.forEach(g => {
                  gamesData.push({
                    awayTeam: g.AwayTeamName || '客隊',
                    awayPitcher: g.AwayPitcherName || '未定',
                    homeTeam: g.HomeTeamName || '主隊',
                    homePitcher: g.HomePitcherName || '未定',
                    venue: g.PlaceName || '未定球場'
                  });
                });
              }

              // 寫入 Firebase 資料庫
              await db.collection('daily_games').doc(todayStr).set({ games: gamesData });
              console.log(\`成功！今天共有 \${gamesData.length} 場比賽已寫入 Firebase！\`);
            } catch (err) {
              console.error('官方數據抓取失敗:', err);
              process.exit(1);
            }
          }
          scrape();
          "
