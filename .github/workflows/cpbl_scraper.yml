name: CPBL Auto Scraper (LINE TODAY API)

on:
  schedule:
    # 每天台灣時間中午 12:30 自動執行 (國際標準時間 04:30)
    - cron: '30 4 * * *'
  workflow_dispatch: # 讓你可以手動在 GitHub 按按鈕立刻執行測試

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install axios firebase-admin

      - name: Run Scraper
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e "
          const axios = require('axios');
          const admin = require('firebase-admin');

          // 初始化 Firebase 後台管理權限
          const serviceAccount = JSON.parse(process.env.FIREBASE_KEY);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });
          const db = admin.firestore();

          async function scrape() {
            try {
              // 1. 取得精準的台灣時間日期字串 (避免 GitHub 美國機房時區偷跑)
              const now = new Date();
              const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
              const twTime = new Date(utc + (3600000 * 8));
              const year = twTime.getFullYear();
              const month = String(twTime.getMonth() + 1).padStart(2, '0');
              const day = String(twTime.getDate()).padStart(2, '0');
              const todayStr = \`\${year}-\${month}-\${day}\`; // 格式：2026-07-29

              console.log('今日目標日期：', todayStr);

              // 🎯 關鍵修正：這是 LINE TODAY 真正傳輸中職 2026 賽程的後台 API 數據網址！
              const apiUrl = 'https://today.line.me/webapi/api/v3/sports/baseball/seasons/CPBL-2026-oB/schedule?timezone=GMT%2B08%3A00&country=TW&page=1&size=300';
              
              const res = await axios.get(apiUrl, {
                headers: { 
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                  'Accept': 'application/json'
                }
              });

              let gamesData = [];

              // 2. 解析 LINE TODAY 真正的數據結構
              if (res.data && res.data.content && res.data.content.games) {
                const allGames = res.data.content.games;
                
                // 找出起迄時間符合今天日期的比賽
                const todaysGames = allGames.filter(g => {
                  if (!g.startTime) return false;
                  // 轉換成台灣時間日期來比對
                  const gDate = new Date(g.startTime);
                  const gUtc = gDate.getTime() + (gDate.getTimezoneOffset() * 60000);
                  const gTw = new Date(gUtc + (3600000 * 8));
                  const gYear = gTw.getFullYear();
                  const gMonth = String(gTw.getMonth() + 1).padStart(2, '0');
                  const gDay = String(gTw.getDate()).padStart(2, '0');
                  return \`\${gYear}-\${gMonth}-\${gDay}\` === todayStr;
                });

                console.log(\`篩選到今日賽事共 \${todaysGames.length} 場\`);

                todaysGames.forEach(g => {
                  gamesData.push({
                    awayTeam: g.guestTeam?.name || '客隊',
                    awayPitcher: g.guestTeam?.startingPitcherName || '未定',
                    homeTeam: g.homeTeam?.name || '主隊',
                    homePitcher: g.homeTeam?.startingPitcherName || '未定',
                    venue: g.venueName || '未定球場'
                  });
                });
              }

              // 3. 寫入 Firebase 資料庫
              await db.collection('daily_games').doc(todayStr).set({ games: gamesData });
              console.log(\`【大成功】成功同步今日 \${gamesData.length} 場比賽至 Firebase！\`);
            } catch (err) {
              console.error('抓取失敗，錯誤細節:', err.message);
              process.exit(1);
            }
          }
          scrape();
          "
