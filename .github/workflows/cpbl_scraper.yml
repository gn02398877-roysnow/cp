name: CPBL Auto Scraper

on:
  schedule:
    # 每天國際標準時間 04:30 (台灣時間中午 12:30) 自動執行
    - cron: '30 4 * * *'
  workflow_dispatch: # 讓你可以手動在 GitHub 按按鈕立刻執行測試

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install axios jsdom firebase-admin

      - name: Run Scraper
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e "
          const axios = require('axios');
          const { JSDOM } = require('jsdom');
          const admin = require('firebase-admin');

          const serviceAccount = JSON.parse(process.env.FIREBASE_KEY);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });
          const db = admin.firestore();

          async function scrape() {
            try {
              const res = await axios.get('https://www.cpbl.com.tw/', {
                headers: { 
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' 
                }
              });
              const dom = new JSDOM(res.data);
              const doc = dom.window.document;

              // 精準對齊中職官網首頁的今日賽事區塊標籤
              const gameElements = doc.querySelectorAll('.schedule_c_box, .game_item, .index_schedule_item');
              let gamesData = [];

              gameElements.forEach((el) => {
                // 抓取客隊與主隊名稱
                const awayTeam = el.querySelector('.away .team_name, .team.away')?.textContent?.trim() || 
                                 el.querySelector('.team_team:nth-of-type(1)')?.textContent?.trim() || '客隊';
                const homeTeam = el.querySelector('.home .team_name, .team.home')?.textContent?.trim() || 
                                 el.querySelector('.team_team:nth-of-type(2)')?.textContent?.trim() || '主隊';
                
                // 抓取球場資訊
                const venue = el.querySelector('.venue, .game_place')?.textContent?.trim() || '未定球場';
                
                // 抓取先發投手
                const awayPitcher = el.querySelector('.away .pitcher, .pitcher_away')?.textContent?.trim() || '未定';
                const homePitcher = el.querySelector('.home .pitcher, .pitcher_home')?.textContent?.trim() || '未定';
                
                // 过滤掉非今日賽事的空區塊
                if (awayTeam !== '客隊' || homeTeam !== '主隊') {
                  gamesData.push({ awayTeam, awayPitcher, homeTeam, homePitcher, venue });
                }
              });

              const todayStr = new Date().toLocaleDateString('zh-TW', {timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit'}).replace(/\//g, '-');
              
              await db.collection('daily_games').doc(todayStr).set({ games: gamesData });
              console.log('今日賽事自動導入成功，共 ' + gamesData.length + ' 場。');
            } catch (err) {
              console.error('抓取失敗:', err);
              process.exit(1);
            }
          }
          scrape();
          "
