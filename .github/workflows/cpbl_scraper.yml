name: CPBL Auto Scraper

on:
  schedule:
    # 每天國際標準時間 04:30 (台灣時間中午 12:30) 自動執行
    - cron: '30 4 * * *'
  workflow_dispatch: # 讓你可以手動在 GitHub 按按鈕立刻執行測試

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install axios jsdom firebase-admin

      - name: Run Scraper
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e "
          const axios = require('axios');
          const { JSDOM } = require('jsdom');
          const admin = require('firebase-admin');

          const serviceAccount = JSON.parse(process.env.FIREBASE_KEY);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });
          const db = admin.firestore();

          async function scrape() {
            try {
              // 1. 抓取中職官網首頁 HTML
              const res = await axios.get('https://www.cpbl.com.tw/', {
                headers: { 
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' 
                }
              });
              
              const dom = new JSDOM(res.data);
              const doc = dom.window.document;

              // 2. 定位官網今日賽事的大框框
              const gameElements = doc.querySelectorAll('.schedule_c_box');
              let gamesData = [];

              gameElements.forEach((el) => {
                // 抓取球場 (位於框框內的 .venue 或 .game_place)
                const venue = el.querySelector('.venue')?.textContent?.trim() || '未定球場';
                
                // 抓取客隊資訊 (.team_c_box.away)
                const awayBox = el.querySelector('.team_c_box.away');
                const awayTeam = awayBox?.querySelector('.team_name')?.textContent?.trim() || '客隊';
                const awayPitcher = awayBox?.querySelector('.pitcher')?.textContent?.trim() || '未定';

                // 抓取主隊資訊 (.team_c_box.home)
                const homeBox = el.querySelector('.team_c_box.home');
                const homeTeam = homeBox?.querySelector('.team_name')?.textContent?.trim() || '主隊';
                const homePitcher = homeBox?.querySelector('.pitcher')?.textContent?.trim() || '未定';

                // 只要有隊伍名稱，就塞進今日比賽名單
                if (awayTeam !== '客隊' && homeTeam !== '主隊') {
                  gamesData.push({
                    awayTeam,
                    awayPitcher: awayPitcher.replace('先發:', '').trim(),
                    homeTeam,
                    homePitcher: homePitcher.replace('先發:', '').trim(),
                    venue
                  });
                }
              });

              // 3. 算出台灣今天的日期字串 (格式: 2026-07-29)
              const now = new Date();
              const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
              const twTime = new Date(utc + (3600000 * 8));
              const year = twTime.getFullYear();
              const month = String(twTime.getMonth() + 1).padStart(2, '0');
              const day = String(twTime.getDate()).padStart(2, '0');
              const todayStr = \`\${year}-\\${month}-\\${day}\`;

              // 4. 強制覆寫寫入 Firebase
              await db.collection('daily_games').doc(todayStr).set({ games: gamesData });
              console.log(\`成功導入！今天共有 \${gamesData.length} 場比賽寫入 Firebase！\`);
            } catch (err) {
              console.error('抓取失敗:', err);
              process.exit(1);
            }
          }
          scrape();
          "
