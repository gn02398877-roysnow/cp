<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPBL 中職勝場預測王</title>
    <!-- 載入 Firebase 必要的 SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #002d56; margin-bottom: 5px; }
        .date-display { text-align: center; color: #666; font-size: 1.1em; margin-bottom: 25px; font-weight: 500; }
        .game-card { border: 2px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #fafafa; }
        .game-info { display: flex; justify-content: space-between; align-items: center; font-size: 1.1em; }
        .team { width: 40%; text-align: center; font-weight: bold; }
        .vs { width: 20%; text-align: center; color: #888; font-style: italic; }
        .venue { text-align: center; margin-top: 10px; color: #666; font-size: 0.9em; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #002d56; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; transition: 0.3s; }
        button:hover { background: #004080; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #002d56; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .no-game { text-align: center; color: #999; font-size: 1.3em; padding: 30px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚾ CPBL 今日賽事預測</h1>
    <div class="date-display" id="current-date">📅 讀取日期中...</div>
    
    <div id="games-section">
        <h2>今日賽事</h2>
        <div id="games-list"><div class="no-game">正在即時抓取中職官網賽事... ⏳</div></div>
    </div>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

    <h2>登記我的預測</h2>
    <form id="prediction-form">
        <div class="form-group">
            <label for="player">你是誰？</label>
            <select id="player" required>
                <option value="">請選擇...</option>
                <option value="柚子">柚子</option>
                <option value="喜德">喜德</option>
                <option value="小哥">小哥</option>
                <option value="小粒">小粒</option>
                <option value="豬豬">豬豬</option>
                <option value="凱智">凱智</option>
            </select>
        </div>

        <div id="predict-choices"></div>

        <div class="form-group">
            <label for="password">防呆/個人密碼</label>
            <input type="password" id="password" placeholder="請輸入密碼以防止別人幫你亂寫" required>
        </div>

        <button type="submit" id="submit-btn" disabled>送出預測</button>
    </form>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

    <h2>🏆 目前積分排行榜</h2>
    <table>
        <thead>
            <tr>
                <th>名次</th>
                <th>玩家</th>
                <th>總命中勝場數</th>
            </tr>
        </thead>
        <tbody id="scoreboard"></tbody>
    </table>
</div>

<script>
    // ⚠️ 請務必在此處替換成你在 Firebase 取得的真正連接金鑰 ⚠️
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 儲存解析出來的今日球賽全域變數
    let globalTodayGames = [];

    function getTaipeiDateString() {
        const d = new Date();
        const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
        const nd = new Date(utc + (3600000 * 8));
        const year = nd.getFullYear();
        const month = String(nd.getMonth() + 1).padStart(2, '0');
        const day = String(nd.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    const todayStr = getTaipeiDateString();

    function initPage() {
        const today = new Date();
        const dateString = today.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        document.getElementById('current-date').innerText = `📅 今天是：${dateString}`;

        fetchCPBLGames();
        loadScoreboard();
    }

    // 🎯 核心：繞過 CORS 直接抓取中職首頁並解析
    async function fetchCPBLGames() {
        const gamesList = document.getElementById('games-list');
        const predictChoices = document.getElementById('predict-choices');

        try {
            const targetUrl = 'https://www.cpbl.com.tw/';
            const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl) + '&_=' + new Date().getTime();

            const res = await fetch(proxyUrl);
            const data = await res.json();
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');

            // 抓取今日賽事的大區塊
            const gameElements = doc.querySelectorAll('.schedule_c_box');
            globalTodayGames = [];

            gameElements.forEach((el) => {
                const venue = el.querySelector('.venue')?.textContent?.trim() || '未定球場';
                
                const awayBox = el.querySelector('.team_c_box.away');
                const awayTeam = awayBox?.querySelector('.team_name')?.textContent?.trim() || '客隊';
                const awayPitcher = awayBox?.querySelector('.pitcher')?.textContent?.trim()?.replace('先發:', '')?.trim() || '未定';

                const homeBox = el.querySelector('.team_c_box.home');
                const homeTeam = homeBox?.querySelector('.team_name')?.textContent?.trim() || '主隊';
                const homePitcher = homeBox?.querySelector('.pitcher')?.textContent?.trim()?.replace('先發:', '')?.trim() || '未定';

                if (awayTeam !== '客隊' && homeTeam !== '主隊') {
                    globalTodayGames.push({ awayTeam, awayPitcher, homeTeam, homePitcher, venue });
                }
            });

            // 渲染畫面
            if (globalTodayGames.length === 0) {
                gamesList.innerHTML = '<div class="no-game">今日尚無比賽 🛌</div>';
                predictChoices.innerHTML = '<p style="color:gray;">今天沒比賽，不用預測。</p>';
                document.getElementById('submit-btn').disabled = true;
                return;
            }

            gamesList.innerHTML = '';
            predictChoices.innerHTML = '';

            globalTodayGames.forEach((game, index) => {
                gamesList.innerHTML += `
                    <div class="game-card">
                        <div class="game-info">
                            <div class="team">${game.awayTeam}<br><small>先發: ${game.awayPitcher}</small></div>
                            <div class="vs">VS</div>
                            <div class="team">${game.homeTeam}<br><small>先發: ${game.homePitcher}</small></div>
                        </div>
                        <div class="venue">📍 球場：${game.venue}</div>
                    </div>
                `;

                predictChoices.innerHTML += `
                    <div class="form-group">
                        <label>預測場次 ${index + 1} 勝隊（${game.awayTeam} VS ${game.homeTeam}）：</label>
                        <select class="game-predict" data-game-id="game${index + 1}" required>
                            <option value="">--請選擇勝出隊伍--</option>
                            <option value="${game.awayTeam}">${game.awayTeam}</option>
                            <option value="${game.homeTeam}">${game.homeTeam}</option>
                        </select>
                    </div>
                `;
            });
            document.getElementById('submit-btn').disabled = false;

        } catch (error) {
            console.error("抓取官網失敗:", error);
            gamesList.innerHTML = '<div class="no-game" style="color:red;">自動抓取官網賽事失敗，請檢查網路。</div>';
        }
    }

    function loadScoreboard() {
        db.collection('user').orderBy('score', 'desc').onSnapshot((snapshot) => {
            const scoreboard = document.getElementById('scoreboard');
            scoreboard.innerHTML = '';
            let rank = 1;
            snapshot.forEach((doc) => {
                const userData = doc.data();
                scoreboard.innerHTML += `<tr><td>${rank++}</td><td>${doc.id}</td><td><strong>${userData.score}</strong> 分</td></tr>`;
            });
        });
    }

    document.getElementById('prediction-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const player = document.getElementById('player').value;
        const password = document.getElementById('password').value;
        
        let choices = {};
        document.querySelectorAll('.game-predict').forEach(select => {
            choices[select.getAttribute('data-game-id')] = select.value;
        });

        db.collection('predictions').doc(`${todayStr}_${player}`).set({
            player: player, password: password, choices: choices, date: todayStr
        })
        .then(() => alert(`🎉 ${player}！你的今日預測已成功登記！`))
        .catch(() => alert("登記失敗，請檢查網路。"));
    });

    window.onload = initPage;
</script>
</body>
</html>
