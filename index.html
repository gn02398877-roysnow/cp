<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPBL 中職勝場預測王</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #002d56; margin-bottom: 5px; }
        .date-display { text-align: center; color: #666; font-size: 1.1em; margin-bottom: 20px; font-weight: 500; }
        
        /* 鑲嵌視窗樣式 */
        .iframe-container { width: 100%; height: 500px; border: 2px solid #002d56; border-radius: 8px; overflow: hidden; margin-bottom: 30px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.1); }
        iframe { width: 100%; height: 100%; border: none; }
        
        .form-group { margin-bottom: 15px; }
        .game-row { display: flex; gap: 15px; margin-bottom: 10px; }
        .game-row div { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #002d56; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; transition: 0.3s; }
        button:hover { background: #004080; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #002d56; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        
        /* 管理端跳轉按鈕 */
        .admin-nav-box { text-align: right; margin-bottom: 15px; }
        .admin-btn { background: #e74c3c; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-size: 0.9em; font-weight: bold; }
        .admin-btn:hover { background: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <!-- 管理端前台跳轉按鈕 -->
    <div class="admin-nav-box">
        <a href="cp.html" class="admin-btn">⚙️ 進入管理端後台</a>
    </div>

    <h1>⚾ CPBL 中職勝場預測王</h1>
    <div class="date-display" id="current-date">📅 讀取日期中...</div>
    
    <!-- 1. 上方鑲嵌中華職棒官網視窗 -->
    <div class="iframe-container">
        <iframe src="https://www.cpbl.com.tw/" title="CPBL Official Website"></iframe>
    </div>

    <!-- 2. 中間預測登記表單 -->
    <h2>登記今日預測</h2>
    <form id="prediction-form">
        <div class="form-group">
            <label for="player">1. 選擇預測人：</label>
            <select id="player" required>
                <option value="">-- 請選擇你的名字 --</option>
                <option value="柚子">柚子</option>
                <option value="喜德">喜德</option>
                <option value="小哥">小哥</option>
                <option value="小粒">小粒</option>
                <option value="豬豬">豬豬</option>
                <option value="凱智">凱智</option>
            </select>
        </div>

        <div class="form-group" style="background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #eee;">
            <label style="color:#002d56; font-size:1.1em; margin-bottom:10px;">2. 請對照上方官網賽程，輸入今日預測獲勝隊伍：</label>
            
            <div class="game-row">
                <div>
                    <label>【第一場預測勝隊】</label>
                    <select class="game-predict" data-game-id="game1">
                        <option value="無比賽">-- 今日無此場次 --</option>
                        <option value="中信兄弟">中信兄弟</option>
                        <option value="統一7-ELEVEn獅">統一7-ELEVEn獅</option>
                        <option value="樂天桃猿">樂天桃猿</option>
                        <option value="富邦悍將">富邦悍將</option>
                        <option value="味全龍">味全龍</option>
                        <option value="台鋼雄鷹">台鋼雄鷹</option>
                    </select>
                </div>
                <div>
                    <label>【第二場預測勝隊】</label>
                    <select class="game-predict" data-game-id="game2">
                        <option value="無比賽">-- 今日無此場次 --</option>
                        <option value="中信兄弟">中信兄弟</option>
                        <option value="統一7-ELEVEn獅">統一7-ELEVEn獅</option>
                        <option value="樂天桃猿">樂天桃猿</option>
                        <option value="富邦悍將">富邦悍將</option>
                        <option value="味全龍">味全龍</option>
                        <option value="台鋼雄鷹">台鋼雄鷹</option>
                    </select>
                </div>
                <div>
                    <label>【第三場預測勝隊】</label>
                    <select class="game-predict" data-game-id="game3">
                        <option value="無比賽">-- 今日無此場次 --</option>
                        <option value="中信兄弟">中信兄弟</option>
                        <option value="統一7-ELEVEn獅">統一7-ELEVEn獅</option>
                        <option value="樂天桃猿">樂天桃猿</option>
                        <option value="富邦悍將">富邦悍將</option>
                        <option value="味全龍">味全龍</option>
                        <option value="台鋼雄鷹">台鋼雄鷹</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="password">3. 輸入個人防呆密碼：</label>
            <input type="password" id="password" placeholder="請輸入密碼以防止別人幫你亂寫" required>
        </div>

        <button type="submit">🚀 送出預測結果</button>
    </form>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

    <!-- 3. 最下面顯示每個人的分數 -->
    <h2>🏆 目前累積積分排行榜</h2>
    <table>
        <thead>
            <tr>
                <th>名次</th>
                <th>玩家</th>
                <th>總命中勝場數</th>
            </tr>
        </thead>
        <tbody id="scoreboard">
            <tr><td colspan="3" style="color:gray;">正在載入排行榜玩家...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCkh2tbXRSUX1nh7XEdpMMs6mUZX5TsPCY",
        authDomain: "cpbl-90cce.firebaseapp.com",
        projectId: "cpbl-90cce",
        storageBucket: "cpbl-90cce.firebasestorage.app",
        messagingSenderId: "910757077086",
        appId: "你的完整appId" // 👈 請補上你在 Firebase 取得的完整 appId
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function getTaipeiDateString() {
        const d = new Date();
        const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
        const nd = new Date(utc + (3600000 * 8));
        const year = nd.getFullYear();
        const month = String(nd.getMonth() + 1).padStart(2, '0');
        const day = String(nd.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    const todayStr = getTaipeiDateString();

    window.onload = function() {
        const today = new Date();
        document.getElementById('current-date').innerText = `📅 今天是：${today.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })}`;
        loadScoreboard();
    };

    function loadScoreboard() {
        const scoreboard = document.getElementById('scoreboard');
        db.collection('user').orderBy('score', 'desc').onSnapshot((snapshot) => {
            scoreboard.innerHTML = '';
            let rank = 1;
            snapshot.forEach((doc) => {
                scoreboard.innerHTML += `<tr><td>${rank++}</td><td>${doc.id}</td><td><strong>${doc.data().score || 0}</strong> 分</td></tr>`;
            });
        });
    }

    document.getElementById('prediction-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const player = document.getElementById('player').value;
        const password = document.getElementById('password').value;
        
        let choices = {};
        document.querySelectorAll('.game-predict').forEach(select => {
            choices[select.getAttribute('data-game-id')] = select.value;
        });

        db.collection('predictions').doc(`${todayStr}_${player}`).set({
            player: player, password: password, choices: choices, date: todayStr
        })
        .then(() => alert(`🎉 ${player}！你的今日預測已成功提交！`))
        .catch(() => alert("登記失敗，請檢查網路。"));
    });
</script>
</body>
</html>
